name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      # Traces of failed tests (playwright.config.ts keeps them on failure), for show-trace.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 14
      # Any advisory fails the build, then every package is checked against the registry's
      # signatures and provenance attestations (needs network access to sigstore, so CI only).
      - run: npm audit --audit-level=low
      - run: npm audit signatures

  parity:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: pepcalc/app
    steps:
      - uses: actions/checkout@v7
        with:
          path: pepcalc/app
      - uses: actions/checkout@v7
        with:
          repository: Gliplog/app
          path: glpcalc/app
      - name: Match sibling branch when present
        working-directory: glpcalc/app
        env:
          CANDIDATES: |
            ${{ github.head_ref }}
            ${{ github.base_ref }}
            ${{ github.event_name != 'pull_request' && github.ref_name || '' }}
        run: |
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            if git ls-remote --exit-code origin "refs/heads/$ref" >/dev/null 2>&1; then
              git fetch --no-tags --depth=1 origin "refs/heads/$ref"
              git checkout -B "$ref" FETCH_HEAD
              echo "Checked out sibling branch: $ref"
              break
            fi
          done <<< "$CANDIDATES"
      - uses: actions/setup-node@v7
        with:
          node-version-file: pepcalc/app/.nvmrc
      - run: npm run parity -- --require-sibling
